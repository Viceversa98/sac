# Local MySQL 8 only. Cloud SQL is the deployed database; this file is not used on Cloud Run.
services:
  mysql:
    image: mysql:8
    ports:
      - "3306:3306"
    environment:
      MYSQL_DATABASE: sampay
      MYSQL_USER: sampay
      MYSQL_PASSWORD: sampay_local
      MYSQL_ROOT_PASSWORD: sampay_local
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - sampay_mysql:/var/lib/mysql

volumes:
  sampay_mysql:
